# Publie une version de « Mes outils » : à chaque étiquette vX.Y.Z poussée sur
# GitHub, construit Mes-outils-Setup.exe et le dépose dans la page Releases.
#   git tag v1.3.0 && git push origin v1.3.0
name: Version

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installateur:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bibliothèques
        run: python -m pip install --disable-pip-version-check -r requirements.txt pyinstaller==6.22.3

      - name: Étiquette = version du code
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Select-String -Path "outil\config.py" -Pattern '^VERSION = "([\d.]+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") { throw "L'étiquette ${{ github.ref_name }} ne correspond pas à VERSION = $version (outil\config.py)" }

      - name: Tests
        # Certains tests touchent le bureau Windows (presse-papiers, coffre) :
        # ils peuvent échouer sur une machine sans session ; ils tournent avant
        # chaque envoi sur le PC du développeur.
        continue-on-error: true
        run: python -m unittest discover -s tests

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Construction
        shell: pwsh
        run: ./packaging/construire.ps1 -Python python

      - uses: actions/upload-artifact@v4
        with:
          name: Mes-outils-Setup
          path: dist/Mes-outils-Setup.exe

      - name: Publication
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Mes-outils-Setup.exe
          generate_release_notes: true
